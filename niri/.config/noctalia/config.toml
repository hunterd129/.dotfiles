[backdrop]
enabled = true

[bar.default]
capsule = true
center = [ "clock", "weather" ]
concave_edge_corners = false
end = [ "tray", "notifications", "clipboard", "network", "volume", "session" ]
margin_edge = 2
margin_ends = 0
start = [ "launcher", "workspaces", "spacer_2", "media" ]
widget_spacing = 8

[hot_corners]
enabled = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 900.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    locked_timeout = 1.0
    timeout = 660.0

[location]
address = "Melville, Canada"

[lockscreen]
grace_period_seconds = 5

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "HDMI-A-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd.kinds]
privacy = false

[shell]
font_family = "Iosevka Aile"
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = false

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "ghostty", "niri" ]

[wallpaper]
directory = "/home/hunter/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/hunter/Pictures/Wallpapers/VN Art/Palette/Mashiroiro Symphony/VN.Art-Pal.let-Mas.Sym-08.png"

    [wallpaper.last]
    path = "/home/hunter/Pictures/Wallpapers/VN Art/Palette/Mashiroiro Symphony/VN.Art-Pal.let-Mas.Sym-08.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/hunter/Pictures/Wallpapers/VN Art/Palette/Mashiroiro Symphony/VN.Art-Pal.let-Mas.Sym-08.png"

[widget.clock]
format = "{:%H:%M:%S}"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.spacer_2]
type = "spacer"
