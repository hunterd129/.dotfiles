scan_timeout = 45

format = """
$nix_shell\
$directory\
$rust\
$c\
$cpp\
$golang\
$lua\
$git_branch\
$git_status\
$line_break\
$character\
"""

right_format = "$cmd_duration"

[directory]
truncation_length = 3
truncation_symbol = '…/'
disabled = false
style = "75"
read_only = ' '
read_only_style = 'bold red'
use_os_path_sep = false

[git_branch]
always_show_remote = false
format = '| [$symbol$branch(:$remote_branch)]($style) '
symbol = " "
style = 'bold purple'
truncation_symbol = '…'
only_attached = false
ignore_branches = []
ignore_bare_repo = false
disabled = false

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = '='
ahead = '⇡'
behind = '⇣'
diverged = '⇕'
up_to_date = ''
untracked = '?'
stashed = '\$'
modified = '!'
staged = '+'
renamed = '»'
deleted = '✘'
typechanged = ""
style = 'bold red'
ignore_submodules = false
worktree_added = ""
worktree_deleted = ""
index_added = ""
index_modified = ""
index_typechanged = ""
disabled = false
use_git_executable = false

[cmd_duration]
min_time = 2_000
show_milliseconds = false
format = 'took [$duration]($style) '
style = 'bold yellow'
disabled = false
show_notifications = false
min_time_to_notify = 45_000

[fill]
symbol = ' '

[rust]
format = '| [$symbol($version )]($style)'
version_format = 'v${raw}'
symbol = ' '
detect_extensions = ['rs']
detect_files = ['Cargo.toml']
detect_folders = []
style = 'bold red'
disabled = false

[c]
format = '| [$symbol($version(\($name)\) )]($style)'
version_format = 'v${raw}'
symbol = ' '
detect_extensions = ['c', 'h']
detect_files = []
detect_folders = []
commands = [['cc', '--version'], ['gcc', '--version'], ['clang', '--version']]
style = 'bold 149'
disabled = false

[cpp]
format = '| [$symbol($version(-$name) )]($style)'
version_format = 'v${raw}'
symbol = ' '
detect_extensions = [
    'cpp',
    'cc',
    'cxx',
    'c++',
    'hpp',
    'hh',
    'hxx',
    'h++',
    'tcc',
]
detect_files = []
detect_folders = []
commands = [
    [
        'c++',
        '--version',
    ],
    [
        'g++',
        '--version',
    ],
    [
        'clang++',
        '--version',
    ],
]
style = 'bold 149'
disabled = false

[golang]
format = '| [$symbol($version )]($style)'
version_format = 'v${raw}'
symbol = '🐹 '
detect_extensions = ['go']
detect_files = [
    'go.mod',
    'go.sum',
    'go.work',
    'glide.yaml',
    'gopkg.yml',
    'gopkg.lock',
    '.go-version',
]
detect_folders = ['Godeps']
style = 'bold cyan'
not_capable_style = 'bold red'
disabled = false

[nix_shell]
format = '[$symbol$state(\$name\))]($style) |'
symbol = '❄️ '
style = 'bold blue'
impure_msg = 'impure'
pure_msg = 'pure'
unknown_msg = ''
disabled = false
heuristic = false

[lua]
format = '| [$symbol($version )]($style)'
version_format = 'v${raw}'
symbol = '🌙 '
detect_extensions = ['lua']
detect_files = ['.lua-version']
style = 'bold blue'
lua_binary = 'lua'
disabled = false

[line_break]
disabled = false

[character]
success_symbol = "[❯](189)"
error_symbol = "[❯](bold yellow)"
